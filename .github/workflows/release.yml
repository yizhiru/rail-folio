# 推送 v* 标签后，在 macOS 与 Windows 上分别打包并上传到同一个 GitHub Release。
# macOS 用 hdiutil 做 DMG，避开 Tauri 自带 bundle_dmg.sh 对 Finder 的依赖。
name: Release desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows
            rust_targets: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS universal DMG
        if: matrix.name == 'macos'
        run: bash scripts/package-mac.sh universal-apple-darwin

      - name: Build Windows NSIS installer
        if: matrix.name == 'windows'
        run: npx tauri build --bundles nsis

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-packages
          if [ "${{ matrix.name }}" = "macos" ]; then
            shopt -s nullglob
            files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "未找到 DMG，target 目录如下：" >&2
              find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app' -o -name '*.exe' \) -print >&2 || true
              exit 1
            fi
            if [ "${#files[@]}" -ne 1 ]; then
              echo "期望 1 个 DMG，实际 ${#files[@]}" >&2
              printf '%s\n' "${files[@]}" >&2
              exit 1
            fi
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            # GitHub Release 会丢掉文件名里的非 ASCII 字符，附件用英文名。
            cp "${files[0]}" "dist-packages/RailFolio_${version}_macos_universal.dmg"
          else
            shopt -s nullglob
            files=(src-tauri/target/release/bundle/nsis/*-setup.exe)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "未找到 NSIS 安装包，target 目录如下：" >&2
              find src-tauri/target -type f \( -name '*.exe' -o -name '*.msi' \) -print >&2 || true
              exit 1
            fi
            if [ "${#files[@]}" -ne 1 ]; then
              echo "期望 1 个安装包，实际 ${#files[@]}" >&2
              printf '%s\n' "${files[@]}" >&2
              exit 1
            fi
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            cp "${files[0]}" "dist-packages/RailFolio_${version}_windows_x64-setup.exe"
          fi
          ls -lh dist-packages

      - uses: actions/upload-artifact@v7
        with:
          name: rail-folio-${{ matrix.name }}
          path: dist-packages/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: rail-folio-*
          merge-multiple: true
          path: dist-packages

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist-packages
          sha256sum -- * > SHA256SUMS
          ls -lh

      - name: Release name
        id: rel
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 火车记 ${{ steps.rel.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            火车记桌面版 ${{ steps.rel.outputs.tag }}。

            ## 安装

            - **macOS（Apple 芯片与 Intel）**：下载 `RailFolio_*_macos_universal.dmg`，打开后把「火车记」拖到「应用程序」。安装包是 ad-hoc 签名，没有 Apple 公证。若系统提示已损坏或无法验证开发者，请右键应用选择「打开」，或到「系统设置 → 隐私与安全性」里点「仍要打开」。
            - **Windows（64 位）**：下载 `RailFolio_*_windows_x64-setup.exe`。安装包未签名，SmartScreen 可能提示未知发布者，选择「仍要运行」。安装时会按需下载 Microsoft Edge WebView2。

            应用显示名称是「火车记」。Release 附件使用英文文件名，避免下载名丢掉中文后变成 `_版本_...`。

            本机截图 OCR 目前只在 macOS 上可用（Vision）。Windows 版可以记行程、导入 JSON/CSV，并在应用内登录 12306 后同步订单。

            档案文件：

            - macOS：`~/Library/Application Support/com.railfolio.app/trips.json`
            - Windows：`%APPDATA%\com.railfolio.app\trips.json`

            校验和见附件 `SHA256SUMS`。
          files: |
            dist-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
